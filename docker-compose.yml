services:
  postgres:
    image: postgres:16-alpine
    container_name: djc-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - dj-network

  clamav:
    image: clamav/clamav:stable
    container_name: djc-clamav
    volumes:
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    restart: always
    networks:
      - dj-network

  redis:
    image: redis:7-alpine
    container_name: djc-redis
    restart: always
    volumes:
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    networks:
      - dj-network

  django:
    build: .
    container_name: djc-django
    restart: always
    env_file: .env
    expose:
      - "8000"
    volumes:
      - type: bind
        source: "/mnt/cloud_edc/CLOUD EDC"
        target: "/app/media/CLOUD EDC"
        bind:
          create_host_path: false
      - ./staticfiles:/app/staticfiles
      - ./partage:/app/partage
      - ./projet:/app/projet
    depends_on:
      - postgres
      - clamav
      - redis
    networks:
      - dj-network

  nginx:
    image: nginx:latest
    container_name: djc-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8443:8443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./logs/nginx:/var/log/nginx
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - django
    networks:
      - dj-network

  fail2ban-ui:
    image: swissmakers/fail2ban-ui:latest
    container_name: djc-fail2ban-ui
    restart: always
    user: "0:0"
    environment:
      - PORT=8436
    volumes:
      - /opt/fail2ban-ui:/config
      - /etc/fail2ban:/etc/fail2ban:ro
      - /run/fail2ban:/var/run/fail2ban
      - /var/log:/var/log:ro
      - /usr/share/GeoIP:/usr/share/GeoIP:ro
    networks:
      - dj-network
    depends_on:
      - prometheus

  # ================== MONITORING ==================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: djc-node-exporter
    restart: always
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - dj-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: djc-cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - dj-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: djc-postgres-exporter
    restart: always
    env_file:
      - ./monitoring/postgres_exporter.env
    networks:
      - dj-network
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:latest
    container_name: djc-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - dj-network
    depends_on:
      - node-exporter
      - cadvisor

  grafana:
    image: grafana/grafana:latest
    container_name: djc-grafana
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
# === Configuration SMTP ===
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=daryl.tiessi26@gmail.com
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=daryl.tiessi26@gmail.com
      - GF_SMTP_FROM_NAME=Graffana EDC Cloud
      - GF_SMTP_STARTTLS_POLICY=Opportunistic


    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - dj-network
    depends_on:
      - prometheus


networks:
  dj-network:
    driver: bridge


volumes:
  prometheus_data:
  grafana_data:
